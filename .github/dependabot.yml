# Weekly dependency-update PRs, grouped to keep the noise down.
#   * github-actions keeps the SHA-pinned actions current (Dependabot bumps the
#     SHA and the version comment together).
#   * pip covers the dependencies declared in pyproject.toml.
# Review a Dependabot PR like any other: let CI run, read the bump, merge if green.

version: 2
# Every ecosystem waits 7 days after a release before Dependabot proposes it
# (cooldown): a compromised or mistaken release is usually caught within days.
# Security updates are not delayed.
updates:
  - package-ecosystem: "github-actions"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "uv"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-patch:
        update-types: ["minor", "patch"]
