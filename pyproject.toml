[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fleetwatch"
version = "1.0.0"
description = "A terminal dashboard for many Claude Code sessions at once: which ones need you, desktop notifications, and a searchable memory that survives compaction"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Pittman" }]
keywords = [
    "claude-code", "claude", "ai-agents", "agentic-coding", "llm", "dashboard",
    "tui", "textual", "terminal", "developer-tools", "notifications",
    "semantic-search", "session-manager", "multi-agent", "iterm2",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Terminals",
    "Topic :: Utilities",
]
requires-python = ">=3.11"
dependencies = ["textual==8.2.8"]

[project.urls]
Homepage = "https://github.com/daniel-pittman/fleetwatch"
Documentation = "https://github.com/daniel-pittman/fleetwatch#readme"
Issues = "https://github.com/daniel-pittman/fleetwatch/issues"
Changelog = "https://github.com/daniel-pittman/fleetwatch/releases"

[project.scripts]
fleetwatch = "fleetwatch.__main__:main"

[project.optional-dependencies]
test = ["pillow==13.0.0"]
search = [
    "sentence-transformers==6.1.0",
    "transformers==5.17.0",
    "torch==2.14.0",
    "tokenizers==0.23.2",
    "huggingface-hub==1.32.0",
    "numpy==2.4.6",
    "pyyaml==6.0.3",
]
memory = [
    "spacy==3.8.16",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "openpyxl==3.1.5",
    "python-pptx==1.0.2",
    "pyyaml==6.0.3",
    "numpy==2.4.6",
]

[tool.setuptools]
# fleetwatch.memory.data holds data files only; the scanner reads its surname list at run
# time to tell all-capital surnames from acronyms.
packages = ["fleetwatch", "fleetwatch.search", "fleetwatch.memory", "fleetwatch.memory.data"]

[tool.setuptools.package-data]
"fleetwatch.memory.data" = ["*.gz", "README.md"]

[tool.ruff]
target-version = "py311"
extend-exclude = [".venv", "build"]

[tool.ruff.lint]
# Correctness rules only (pyflakes plus the E4/E7/E9 pycodestyle subset);
# style and line length are not enforced.
select = ["E4", "E7", "E9", "F"]
# A lambda assigned to a name is used for short local callbacks.
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
# Imports kept to probe availability or to re-export a public name.
"fleetwatch/views.py" = ["F401"]
"fleetwatch/memory/doc_corpus.py" = ["F401"]
# Test modules import each other for shared fixtures and sort sys.path first.
"tests/**" = ["F401", "F841", "E401", "E402", "E741"]
